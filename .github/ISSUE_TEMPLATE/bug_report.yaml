name: Bug report
description: "Report a problem in Cataclysm: RODINA"
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can it be reproduced?
      description: List the steps needed to reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      description: Include the version shown in the game or the full build commit.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: Linux x64 or Windows x64
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Logs, save, or screenshots
      description: Attach relevant files if they help reproduce the problem.
