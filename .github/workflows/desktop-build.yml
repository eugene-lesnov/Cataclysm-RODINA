name: RODINA Desktop Build
run-name: "RODINA Desktop Build / ${{ github.head_ref || github.ref_name }} / ${{ github.event_name }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libfreetype6-dev libncursesw5-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev
      - name: Build Linux archive
        run: |
          make -j3 TILES=1 SOUND=1 RELEASE=1 LOCALIZE=1 LANGUAGES=ru \
            BACKTRACE=1 LIBBACKTRACE=0 PCH=0 ASTYLE=0 LINTJSON=0 TESTS=0 \
            USE_XDG_DIR=1 all
          make TILES=1 SOUND=1 RELEASE=1 LOCALIZE=1 LANGUAGES=ru \
            BACKTRACE=1 LIBBACKTRACE=0 PCH=0 ASTYLE=0 LINTJSON=0 TESTS=0 \
            USE_XDG_DIR=1 bindist
          mv cataclysm-rodina-0.1-dev.tar.gz \
            "Cataclysm-RODINA-${GITHUB_SHA}-linux-x64.tar.gz"
      - name: Upload Linux archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Cataclysm-RODINA-${{ github.sha }}-linux-x64
          path: Cataclysm-RODINA-${{ github.sha }}-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify source commit
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw "Checkout does not match GITHUB_SHA." }
      - name: Install CMake 3.31.6
        uses: lukka/get-cmake@56d043d188c3612951d8755da8f4b709ec951ad6 # v3.31.6
        with:
          cmakeVersion: 3.31.6
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Install vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: 'f6672d8e480ccdecddfad3fd1b838ba369ffe6cd'
          vcpkgJsonGlob: 'msvc-full-features/vcpkg.json'
      - name: Integrate vcpkg
        run: vcpkg integrate install --vcpkg-root '${{ runner.workspace }}\b\vcpkg'
      - name: Install gettext
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda # v2.30.0
        with:
          msystem: mingw64
          install: gettext make
      - name: Compile Russian translation
        shell: msys2 {0}
        run: lang/compile_mo.sh ru
      - name: Build Windows archive
        env:
          BACKTRACE: 1
          CDDA_RELEASE_BUILD: 1
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\.github\vcpkg_triplets
        run: |
          msbuild -m -p:Configuration=Release -p:Platform=x64 "-target:Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static;zzip" msvc-full-features\Cataclysm-vcpkg-static.sln
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed." }
          .\build-scripts\windist.ps1
          Move-Item cataclysm-rodina-0.1-dev.zip "Cataclysm-RODINA-$($env:GITHUB_SHA)-windows-x64.zip"
      - name: Upload Windows archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Cataclysm-RODINA-${{ github.sha }}-windows-x64
          path: Cataclysm-RODINA-${{ github.sha }}-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
