name: RODINA CI
run-name: "RODINA CI / ${{ github.head_ref || github.ref_name }} / ${{ github.event_name }}"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rodina-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y astyle gettext python3-pip
          python3 -m pip install --user polib
      - name: Validate JSON syntax and style
        run: |
          python3 build-scripts/validate_json.py
          make style-all-json-parallel RELEASE=1
          git diff --exit-code -- data
      - name: Check C++ formatting
        run: |
          astyle -Q -X --dry-run src/game.h >/dev/null
          make astyle-check
      - name: Validate translations
        run: |
          for po_file in lang/po/*.po; do
            echo "Checking $po_file"
            msgfmt -c -o /dev/null "$po_file"
          done
          python3 tools/check_po_printf_format.py

  desktop-build:
    needs: validate
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: read
