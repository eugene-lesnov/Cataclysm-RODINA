name: RODINA CI
run-name: "RODINA CI / ${{ github.head_ref || github.ref_name }} / ${{ github.event_name }}"

on:
  push:
    branches:
      - master
    tags:
      - 'rodina-v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rodina-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^rodina-v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y astyle gettext python3-pip
          python3 -m pip install --user polib
      - name: Validate JSON syntax and style
        run: |
          python3 build-scripts/validate_json.py
          make style-all-json-parallel RELEASE=1
          git diff --exit-code -- data
      - name: Check C++ formatting
        run: |
          astyle -Q -X --dry-run src/game.h >/dev/null
          make astyle-check
      - name: Validate Russian translation
        run: |
          msgfmt -c -o /dev/null lang/po/ru.po
          python3 tools/check_po_printf_format.py ru

  desktop-build:
    needs: validate
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: read

  draft-release:
    if: startsWith(github.ref, 'refs/tags/rodina-v')
    needs: [validate, desktop-build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download game archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Cataclysm-RODINA-${{ github.sha }}-*
          path: dist
          merge-multiple: true
      - name: Verify archives and resource trees
        run: |
          version="${GITHUB_REF_NAME#rodina-v}"
          linux="dist/Cataclysm-RODINA-${GITHUB_REF_NAME}-linux-x64.tar.gz"
          windows="dist/Cataclysm-RODINA-${GITHUB_REF_NAME}-windows-x64.zip"
          tar -tzf "$linux" >/dev/null
          unzip -tq "$windows" >/dev/null
          tar -xOf "$linux" "cataclysm-rodina-${version}/VERSION.txt" | grep -Fx "rodina version: $version"
          unzip -p "$windows" VERSION.txt | tr -d '\r' | grep -Fx "rodina version: $version"
          tar -xOf "$linux" "cataclysm-rodina-${version}/VERSION.txt" | grep -Fx "commit sha: $GITHUB_SHA"
          unzip -p "$windows" VERSION.txt | tr -d '\r' | grep -Fx "commit sha: $GITHUB_SHA"
          tar -xOf "$linux" "cataclysm-rodina-${version}/RESOURCE-TREES.txt" > linux-trees.txt
          unzip -p "$windows" RESOURCE-TREES.txt > windows-trees.txt
          tr -d '\r' < windows-trees.txt > windows-normalized.txt
          cmp linux-trees.txt windows-normalized.txt
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Cataclysm: RODINA %s\n\nBased on CDDA 0.I-1. Commit: %s\n\nLinux requires system SDL2 libraries.\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" > release-notes.txt
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            test "$(cat release-state.txt)" = true
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt \
              --verify-tag --draft --prerelease --latest=false \
              --title "Cataclysm: RODINA $GITHUB_REF_NAME" --notes-file release-notes.txt
          fi
